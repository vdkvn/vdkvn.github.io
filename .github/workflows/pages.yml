name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Tự động chạy mỗi ngày lúc 07:00 sáng giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync latest addons and AI articles
        run: npm run sync:all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push updated data back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/addons-store.json lib/updates.json lib/articles.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-sync latest NVDA addons, articles and project updates [skip ci]"
            git push origin main
          else
            echo "No data changes to commit."
          fi
      - name: Build static website
        run: |
          npm run build
          touch dist/client/.nojekyll
          echo "vdk.is-a.dev" > dist/client/CNAME
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
